[tox]
minversion = 4.0
envlist =
    py39-sk122
    py39-sk132
    py39-sk142
    py39-sk152
    py39-sk161
    py310-sk122
    py311-sk122
    py310-sk132
    py312-sk132
    py310-sk142
    py312-sk142
    py310-sk152
    py313-sk152
    py310-sk161
    py310-sk172
    py311-sk161
    py311-sk180
    py312-sk161
    py312-sk180
    py313-sk161
    py313-sk180
    py314-sk161
    py314-sk180

[testenv]
description = Run tests with pytest
commands_pre =
    python -m pip install --upgrade pip setuptools wheel
deps =
    pytest
    pandas
    # scipy 1.15 macOS wheels for Python 3.10 fail to load on recent macOS.
    scipy<1.15; python_version < "3.11" and sys_platform == "darwin"
    # scikit-learn < 1.4.2 is built against NumPy 1.x.
    sk122: scikit-learn==1.2.2
    sk122: numpy<2
    sk132: scikit-learn==1.3.2
    sk132: numpy<2
    sk142: scikit-learn==1.4.2
    sk152: scikit-learn==1.5.2
    sk161: scikit-learn==1.6.1
    sk172: scikit-learn==1.7.2
    sk180: scikit-learn==1.8.0


commands =
    pytest
